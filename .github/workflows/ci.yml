name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jasno
          POSTGRES_PASSWORD: jasno
          POSTGRES_DB: jasno
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jasno -d jasno"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      LLM_MODE: demo
      NODE_ENV: test
      DATABASE_URL: postgresql://jasno:jasno@localhost:5432/jasno
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter jasno-api db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter jasno-web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7

  # B13: образ собирается и запускается на пустой базе (миграции при старте), сайт и API отвечают
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - name: Сайт и API в контейнере
        run: |
          curl -fsS http://127.0.0.1:8080/health | grep -q '"llmMode":"demo"'
          curl -fsS -H 'Accept: text/html' http://127.0.0.1:8080/app/cases | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/assets/gibt-es-nicht.js)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/cases)" = 401
          docker compose exec -T db psql -U jasno -d jasno -tAc 'select count(*) from _prisma_migrations where finished_at is not null' | grep -qv '^0$'
      - if: failure()
        run: docker compose logs app
      - if: always()
        run: docker compose down -v
